}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================================================
//  ANTEPROJETO ELÉTRICO — Obra Mariára (as built) — NBR 5410:2004
//  Pontos, circuitos e cálculos: src/18-eletrica.js (o mesmo módulo desenha a camada "Elétrica" no estúdio).
// =====================================================================================================
const E = DD.eletrica;
const { PONTOS, PBY, CIRC, FASES, DRS, ALIM, QT, COLOR, LEVEL, TETO, QDC_XY, QDT_XY, RISER, ALIM_ROUTE, TEL_ROUTE, TEL, fmtm, fmtn } = E;
const L1 = 2880, L2 = 5760, LR = 8640;
const REF_DOC = window.DD && DD.data ? DD.data.initialState() : null;
let doc = REF_DOC;
const DOC_SRC = { kind: 'ref', at: null };
const PRANCHAS = [
  { id: 'T', label: 'Térreo', fid: 'f0' },
  { id: '1', label: '1º Pav.', fid: 'f1' },
  { id: '2', label: '2º Pav.', fid: 'f2' },
  { id: '3d', label: '3D' },
  { id: 'calc', label: 'Quadro de cargas e memorial' },
  { id: 'mat', label: 'Materiais' },
  { id: 'pdf', label: 'Pranchas (PDF)' },
];
const PLAN_TABS = ['T', '1', '2'];
const KCOL = { il: COLOR.il, int: COLOR.il, int3: COLOR.il, tug: COLOR.tug, tue: COLOR.tue, qdc: COLOR.qdc, medidor: COLOR.qdc, tel: COLOR.tel };
const tipoOf = (p) => (p.k === 'int' || p.k === 'int3' || p.k === 'il' ? 'il' : p.k === 'tug' ? 'tug' : p.k === 'tue' ? 'tue' : p.k === 'tel' ? 'tel' : 'qdc');
const TEL_LABEL = { entrada: 'Caixa de entrada da fibra', passagem: 'Caixa de passagem da fibra', qdt: 'Quadro de telecom (QDT)', rj: 'Ponto de rede RJ45', ap: 'Ponto de Wi-Fi no teto' };
const S = { tab: 'T', layers: { il: true, tug: true, tue: true, tel: true, TXT: true, WALLS: true }, view: null, hover: null };
const KIND_LABEL = { il: 'Ponto de luz', int: 'Interruptor', int3: 'Interruptor paralelo', tug: 'Tomada de uso geral', tue: 'Tomada/ponto de uso específico', qdc: 'Quadro de distribuição', medidor: 'Padrão de entrada' };

const $ = (id) => document.getElementById(id);
const tabs = $('tabs');
PRANCHAS.forEach((p) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = p.id; b.textContent = p.label;
  b.addEventListener('click', () => setTab(p.id));
  tabs.appendChild(b);
});
$('layers').addEventListener('change', (e) => {
  const k = e.target.dataset.layer;
  if (!k) return;
  S.layers[k] = e.target.checked;
  drawPlan(); if (S.tab === '3d') sync3D();
});

// ---------------------------------------------------------------------------------------------- planta
const plan = $('plan');
let ctx = plan.getContext('2d');
const BOUNDS = { T: [-300, 1700, 9300, 20400], 1: [-300, 2300, 9300, 16500], 2: [-300, 2300, 9300, 15300] };
function fitView() {
  const [x0, y0, x1, y1] = BOUNDS[S.tab] || BOUNDS.T;
  const w = plan.clientWidth, h = plan.clientHeight;
  const s = Math.min((w - 30) / (x1 - x0), (h - 30) / (y1 - y0));
  S.view = { s, ox: (w - (x1 - x0) * s) / 2 - x0 * s, oy: (h - (y1 - y0) * s) / 2 - y0 * s };
}
const X = (x) => S.view.ox + x * S.view.s;
const Y = (y) => S.view.oy + y * S.view.s;
function wallRect(w) {
  const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L * w.thick / 2, ny = dx / L * w.thick / 2;
  return [[w.a.x + nx, w.a.y + ny], [w.b.x + nx, w.b.y + ny], [w.b.x - nx, w.b.y - ny], [w.a.x - nx, w.a.y - ny]];
}
function drawWalls(fid, faint) {
  if (!doc) return;
  const walls = doc.walls.filter((w) => w.floor === fid);
  walls.forEach((w) => {
    const r = wallRect(w);
    ctx.beginPath(); r.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.closePath();
    ctx.fillStyle = faint ? 'rgba(46,42,38,.18)' : w.kind === 'structural' ? '#3a3631' : w.kind === 'partition' ? '#8c8375' : w.kind === 'railing' ? 'rgba(46,42,38,.35)' : '#b3aa9b';
    ctx.fill();
  });
  if (faint) return;
  doc.openings.forEach((o) => {
    const w = walls.find((x) => x.id === o.wall);
    if (!w) return;
    const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const c0 = o.t - o.width / 2, c1 = o.t + o.width / 2;
    const fake = { a: { x: w.a.x + ux * c0, y: w.a.y + uy * c0 }, b: { x: w.a.x + ux * c1, y: w.a.y + uy * c1 }, thick: w.thick + 6 };
    const r = wallRect(fake);
    ctx.beginPath(); r.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.closePath();
    ctx.fillStyle = '#f3efe6'; ctx.fill();
    if (o.type === 'window') {
      ctx.strokeStyle = '#3a3631'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(fake.a.x), Y(fake.a.y)); ctx.lineTo(X(fake.b.x), Y(fake.b.y)); ctx.stroke();
      ctx.stroke(new Path2D(r.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1])).join(' ') + 'Z'));
    }
  });
}

function label(txt, x, y, color, small, bg) {
  ctx.font = (small ? '500 10px' : '600 11px') + ' "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 6;
  ctx.fillStyle = bg || 'rgba(243,239,230,.88)'; ctx.fillRect(X(x) - w / 2, Y(y) - 7, w, 14);
  ctx.fillStyle = color || '#1f1d1a'; ctx.fillText(txt, X(x), Y(y));
}

const visible = (p) => p.k === 'qdc' || p.k === 'medidor' || S.layers[tipoOf(p)];
function drawPlan() {
  if (!PLAN_TABS.includes(S.tab)) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = plan.clientWidth, h = plan.clientHeight;
  if (!w || !h) return;
  if (!S.view) fitView();
  plan.width = Math.round(w * dpr); plan.height = Math.round(h * dpr);
  ctx = plan.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintFloor(S.tab, w, h, false, dpr);
}
function paintFloor(fl, w, h, print, k) {
  ctx.fillStyle = print ? '#ffffff' : '#f3efe6'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#e7e1d5'; ctx.lineWidth = 1;
  const g = 1000 * S.view.s;
  if (g > 12) {
    for (let x = S.view.ox % g; x < w; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = S.view.oy % g; y < h; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  }
  const P = PRANCHAS.find((p) => p.id === fl);

function buildArch3D(target) {

  const level = Object.fromEntries(doc.floors.map((f) => [f.id, f.level]));

    const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy);

      const s0 = cuts[i], s1 = cuts[i + 1], op = ops.find((o) => o.a === s0 && o.b === s1);
      if (!op) piece(s0, s1, 0, H); else { piece(s0, s1, 0, op.z0); piece(s0, s1, op.z1, H); }

  const slabMat = new THREE.MeshStandardMaterial({ color: 0xbdb4a5, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide });

  const s = Math.min((W - 40) / (x1 - x0), (H - 40) / (y1 - y0));

    paintFloor(sh.fl, W, H, true, k);
    ctx.font = '600 9px "JetBrains Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.strokeStyle = '#555'; ctx.globalAlpha = 0.6; ctx.lineWidth = 0.8; ctx.setLineDash([3, 2]);

      let pos = null;
      for (const [dx, dy] of dirs) { const c = [lx + dx, ly + dy]; if (!placed.some((q) => Math.hypot(q[0] - c[0], q[1] - c[1]) < 16) && !pts.some((o) => Math.hypot(X(o.x) - c[0], Y(o.y) - c[1]) < 7)) { pos = c; break; } }

      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(pos[0], pos[1]); ctx.stroke();
      ctx.fillStyle = KCOL[p.p.k] || '#333'; ctx.beginPath(); ctx.arc(pos[0], pos[1], 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(String(p.n), pos[0], pos[1] + 0.5);
    });

    ctx.fillText('↑ FUNDO (quintal)', 12, 18); ctx.fillText('↓ FRENTE (rua)', 12, H - 12);
  } finally {

}
const SYMB = `<span class="sy"><b style="color:${COLOR.il}">⊗</b> luz no teto · <b style="color:${COLOR.il}">●</b> arandela · <b style="color:${COLOR.il}">□</b> interruptor (◩ paralelo) · <b style="color:${COLOR.tug}">△</b> tomada 100 VA · <b style="color:${COLOR.tug}">▲</b> tomada 600 VA · <b style="color:${COLOR.tue}">▲</b> uso específico · <b>▬</b> QDC · <b style="color:${COLOR.tel}">◆</b> RJ45 · <b style="color:${COLOR.tel}">◉</b> Wi-Fi · tracejado = eletroduto na laje · traço-ponto azul = rede</span>`;
function pranchas() {
  const hoje = new Date().toLocaleDateString('pt-BR');
  let nChanged = 0;
  const fonte = srcText(true), total = SHEETS.length + 1;
  const pages = SHEETS.map((sh, i) => {
    const pts = sheetPoints(sh).map((p) => Object.assign(p, { ref: refsOf(sh.fid, p.x, p.y) }));
    if (doc !== REF_DOC) pts.forEach((p) => (p.changed = refText(p.ref) !== refText(refsOf(sh.fid, p.x, p.y, REF_DOC))));

    const img = renderSheetImage(sh, pts);

    nChanged += pts.filter((p) => p.changed).length;
    return `<section class="sheet">
      <header class="sh-head"><div><b>Obra Mariára — Projeto elétrico (NBR 5410)</b><span>${esc(sh.titulo)}</span></div><div class="sh-meta">Prancha ${i + 1}/${total} · ${hoje} · ${esc(fonte)}<br>ANTEPROJETO — conferir no local e com o responsável técnico</div></header>
      <div class="sh-body"><div class="sh-img"><img src="${img}" alt="${esc(sh.titulo)}"></div>
      <div class="sh-tab"><table class="pts fix"><colgroup><col style="width:5%"><col style="width:35%"><col style="width:6%"><col style="width:44%"><col style="width:10%"></colgroup><thead><tr><th>Nº</th><th>Item</th><th>Circ.</th><th>Medida a partir de (face da parede)</th><th>Altura</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>
      <footer class="sh-foot">${SYMB}<br>Medidas em metros, do <b>centro da caixa</b> até a <b>face da alvenaria</b> mais próxima (sem reboco), na direção indicada (esquerda/direita = olhando a planta com o fundo para cima; fundo = lado do quintal; frente = lado da rua). Alturas do <b>piso acabado</b> ao centro da caixa. Circuitos e disjuntores: ver o quadro de cargas (prancha ${total}).</footer>
    </section>`;
  });
  const cRows = CIRC.map((c) => `<tr><td class="c">C${c.n}</td><td>${esc(c.desc)}</td><td class="c">${c.v} V · ${c.fases}</td><td class="n">${c.va}</td><td class="c">${String(c.secao).replace('.', ',')} mm²</td><td class="c">${c.v === 220 ? '2P' : '1P'} ${c.disj} A</td><td class="c">${c.dr || ''}</td></tr>`);

    <header class="sh-head"><div><b>Obra Mariára — Projeto elétrico (NBR 5410)</b><span>Quadro de distribuição (QDC): circuitos e diagrama unifilar</span></div><div class="sh-meta">Prancha ${total}/${total} · ${hoje}<br>ANTEPROJETO — conferir com o responsável técnico</div></header>
    <div class="sh-body q"><div class="sh-uni">${unifilar(620, true)}</div>
    <div class="sh-tab"><table class="pts"><thead><tr><th>Circ.</th><th>Descrição</th><th>Tensão</th><th>VA</th><th>Cabo</th><th>Disjuntor</th><th>DR</th></tr></thead><tbody>${cRows.join('')}</tbody></table>
    <p class="sh-note">Geral: 3P ${ALIM.disj} A · alimentador 3×${ALIM.secao} + N ${ALIM.neutro} + PE ${ALIM.pe} mm² · DPS 4× 275 V 20 kA · QDC de ${QT.qdc} módulos sob a escada, centro a 1,50 m. Demanda ${fmtn(ALIM.D, 1)} kW (${fmtn(ALIM.I, 0)} A). Fases: A ${fmtn(FASES.A / 1000, 1)} · B ${fmtn(FASES.B / 1000, 1)} · C ${fmtn(FASES.C / 1000, 1)} kVA.</p></div></div>
    <footer class="sh-foot">Neutro azul-claro · terra verde/verde-amarelo · fases preto, vermelho e branco · retorno amarelo. Todos os circuitos com DR 30 mA. Chuveiros em eletroduto exclusivo.</footer>
  </section>`);
  const aviso = nChanged
    ? `<p class="callout warn"><b>${nChanged} ${nChanged === 1 ? 'ponto tem' : 'pontos têm'} parede diferente</b> da planta usada no projeto elétrico (a planta da nuvem foi alterada perto deles). As medidas já usam as paredes atuais; confira esses pontos (⚠) antes de executar.</p>`

  return `<div class="noprint" style="margin-bottom:14px">${aviso}<p class="callout">Paredes: <b>${esc(srcText(false))}</b>. Pranchas de execução por pavimento para o eletricista, mais o quadro de distribuição. Cada ponto tem um número na planta e, na tabela, o circuito, a distância até a face da parede de referência e a altura. Para gerar o PDF: <b>Imprimir → Salvar como PDF</b>, papel <b>A3 paisagem</b>.</p><button class="btn" id="print" type="button">Imprimir / salvar em PDF</button></div>${pages.join('')}`;
}

// ---------------------------------------------------------------------------------------------- painel lateral
function side() {
  const fl = S.tab;
  const P = PONTOS.filter((p) => p.fl === fl || fl === '3d');
  const n = (k) => P.filter((p) => p.k === k).length;
  const circs = CIRC.filter((c) => fl === '3d' || c.pts.some((id) => PBY[id].fl === fl));
  $('side').innerHTML = `
    <h2>${fl === '3d' ? '3D — eletrodutos e pontos' : PRANCHAS.find((p) => p.id === fl).label}</h2>
    <p class="sub">${fl === '3d' ? 'Gire com o mouse/dedo. Eletrodutos na laje e descidas nas paredes; o alimentador chega enterrado do padrão ao QDC.' : 'Arraste para mover, roda ou pinça para zoom. Passe o mouse num ponto para ver o circuito. Ao lado de cada ponto: nº do circuito · VA.'}</p>
    <div class="kpis">

      <div class="kpi"><b>${QT.qdc}</b><span>módulos no QDC (sob a escada)</span></div>

      <span><i style="border-color:${COLOR.il};border-top-style:dashed"></i>Iluminação (pontos, arandelas, interruptores)</span>

    </div>
    <h3>Circuitos ${fl === '3d' ? '' : 'que passam aqui'}</h3>
    <ul class="list">${circs.map((c) => `<li><b style="color:${COLOR[c.tipo]}">C${c.n}</b> ${esc(c.desc)} — ${c.secao} mm², ${c.disj} A</li>`).join('')}</ul>
    <p class="sub" style="margin-top:14px">Anteprojeto: revisar com responsável técnico (ART/RRT) antes de executar. Detalhes em <b>Quadro de cargas e memorial</b>.</p>`;
}

// ---------------------------------------------------------------------------------------------- planta da nuvem
const fmtWhen = (t) => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
function srcText(short) {
  if (DOC_SRC.kind === 'cloud') return short ? 'paredes: nuvem ' + fmtWhen(DOC_SRC.at) : 'planta salva na nuvem da obra em ' + fmtWhen(DOC_SRC.at) + ' (a mesma do estúdio)';
  if (DOC_SRC.kind === 'erro') return short ? 'paredes: referência' : 'planta as built de referência (não foi possível ler a nuvem agora)';
  return short ? 'paredes: referência' : 'planta as built de referência (entre com a conta da obra para usar a planta da nuvem)';
}
function setSrcBadge() {
  const b = $('src-badge');
  if (!b) return;
  b.dataset.kind = DOC_SRC.kind;
  b.textContent = DOC_SRC.kind === 'cloud' ? 'planta da nuvem · ' + fmtWhen(DOC_SRC.at) : 'planta de referência';
  b.title = srcText(false);
}
const planOK = (d) =>

  d.walls.every((w) => w && w.a && w.b && [w.a.x, w.a.y, w.b.x, w.b.y, w.thick].every(Number.isFinite) && typeof w.floor === 'string');
/** Troca as paredes em uso e redesenha a aba aberta (sem perder o enquadramento da planta). */

  doc = d;

    while (R3.arch.children.length) { const m = R3.arch.children.pop(); if (m.geometry) m.geometry.dispose(); }
    buildArch3D(R3.arch);
  }
  if (['T', '1', '2', 'C'].includes(S.tab)) drawPlan();

}
async function loadCloudPlan(auth) {
  const a = auth || window.projetoAuth;
  if (!a || !a.ready) return false;
  try {
    const ctx = await a.ready;
    if (!ctx || !ctx.client || !ctx.obraId) return false;
    const res = await ctx.client.from('projeto_planta').select('doc, atualizado_em').eq('obra_id', ctx.obraId).maybeSingle();
    if (res.error) throw res.error;
    if (!res.data || !planOK(res.data.doc)) return false; // a obra ainda não salvou a planta: segue a de referência
    let d = res.data.doc;
    try { if (DD.data.migrateAsBuilt) d = DD.data.migrateAsBuilt(Object.assign({ roomSeeds: [], furniture: [] }, d)).doc; } catch (e) { /* usa como veio */ }
    useDoc(d, { kind: 'cloud', at: res.data.atualizado_em });
    return true;
  } catch (e) {
    console.warn('[eletrica] planta da nuvem indisponível', e);

    return false;
  }

// ---------------------------------------------------------------------------------------------- abas
function setTab(id) {
  S.tab = id;
  [...tabs.children].forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'));
  const isPlan = PLAN_TABS.includes(id), is3d = id === '3d', isDoc = id === 'calc' || id === 'mat' || id === 'pdf';
  plan.hidden = !isPlan; $('view3d').hidden = !is3d; $('doc').hidden = !isDoc;
  $('layers').hidden = isDoc; $('hint').hidden = !isPlan; $('lbl-walls').hidden = !is3d; $('tip').hidden = true;
  $('main').classList.toggle('wide', isDoc);
  $('stage').classList.toggle('docmode', isDoc);
  $('side').hidden = isDoc;
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
  if (isPlan) { S.view = null; requestAnimationFrame(() => { fitView(); drawPlan(); }); side(); }
  if (is3d) { init3D(); requestAnimationFrame(sync3D); side(); }
  if (isDoc) {
    $('doc').innerHTML = id === 'calc' ? memorial() : id === 'mat' ? materiais() : pranchas();
    $('doc').scrollTop = 0;

    const pr = $('print'); if (pr) pr.addEventListener('click', () => window.print());
  }
}
new ResizeObserver(() => { if (PLAN_TABS.includes(S.tab)) { fitView(); drawPlan(); } if (S.tab === '3d') sync3D(); }).observe($('stage'));
const h0 = (location.hash || '').slice(1);
setTab(PRANCHAS.some((p) => p.id === h0) ? h0 : 'T');
