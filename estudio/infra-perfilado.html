<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================================================
//  INFRA EM PERFILADO 38×38 — anteprojeto separado (não altera o projeto elétrico do estúdio).
//  Cálculo em infra-perfilado.js (DD.perfilado): traçado, derivações, agrupamento, ocupação e materiais.
//  Mesmo sistema do estúdio: mm, origem no canto fundo-esquerdo do lote, x → direita, y → rua, z = altura.
// =====================================================================================================
const $ = (id) => document.getElementById(id);
const DD = window.DD, E = DD.eletrica, P = DD.perfilado;
const REF = DD.data.initialState();
const RES = P.tudo();
const FID = { T: 'f0', 1: 'f1', 2: 'f2' };
const NOME = { T: 'Térreo', 1: '1º pavimento', 2: '2º pavimento' };
const ROOMS = { f0: DD.rooms.compute(REF, 'f0'), f1: DD.rooms.compute(REF, 'f1'), f2: DD.rooms.compute(REF, 'f2') };
const TABS = [
  { id: 'T', k: 'T', nome: 'Térreo', bounds: [-300, 2500, 9300, 15400] },
  { id: '1', k: '1', nome: '1º pav.', bounds: [-300, 2500, 9300, 16400] },
  { id: '2', k: '2', nome: '2º pav.', bounds: [-300, 2500, 9300, 15200] },
  { id: 'M', k: 'M', nome: 'Materiais' },
  { id: 'D', k: 'D', nome: 'Detalhes' },
];
const S = { tab: 'T', view: 'split', pv: null, casa: 'vidro' };
const fl = () => (/^[T12]$/.test(S.tab) ? S.tab : 'T');
const fmt = (mm, d = 2) => (mm / 1000).toFixed(d).replace('.', ',');
const num = (v, d = 0) => Number(v).toFixed(d).replace('.', ',');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const COR = { perf: '#1f6f8b', perfIn: '#9cc3d1', luz: '#d99a00', int: '#b7791f', tug: '#c0392b', tue: '#1f5fbf', arandela: '#d99a00', fora: '#9a9285', trav: '#e0703f', susp: '#1f1d1a', qd: '#1f1d1a' };

// ---------------------------------------------------------------- abas
const tabsEl = $('tabs');
TABS.forEach((t) => {
  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.dataset.tab = t.id;
  b.innerHTML = `<span class="k">${t.k}</span>${t.nome}`;
  b.addEventListener('click', () => setTab(t.id));
  tabsEl.appendChild(b);
});

// ---------------------------------------------------------------- planta 2D
const plan = $('plan');
let ctx = plan.getContext('2d');
const wallPoly = (w) => {
  const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1, nx = (-dy / L) * w.thick / 2, ny = (dx / L) * w.thick / 2;
  return [{ x: w.a.x + nx, y: w.a.y + ny }, { x: w.b.x + nx, y: w.b.y + ny }, { x: w.b.x - nx, y: w.b.y - ny }, { x: w.a.x - nx, y: w.a.y - ny }];
};
function fitView() {
  const t = TABS.find((q) => q.id === fl()), [x0, y0, x1, y1] = t.bounds;
  const w = plan.clientWidth, h = plan.clientHeight;
  const s = Math.min((w - 24) / (x1 - x0), (h - 24) / (y1 - y0));
  S.pv = { s, ox: (w - (x1 - x0) * s) / 2 - x0 * s, oy: (h - (y1 - y0) * s) / 2 - y0 * s };
}
const X = (x) => S.pv.ox + x * S.pv.s;
const Y = (y) => S.pv.oy + y * S.pv.s;
const poly = (pts) => { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)))); ctx.closePath(); };
function label(txt, x, y, o = {}) {
  ctx.font = `${o.bold ? 600 : 500} ${o.size || 11}px "JetBrains Mono", monospace`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 8;
  if (o.bg !== false) {
    ctx.fillStyle = o.bg || 'rgba(243,239,230,.9)';
    const bx = o.align === 'left' ? X(x) - 4 : o.align === 'right' ? X(x) - w + 4 : X(x) - w / 2;
    ctx.fillRect(bx, Y(y) - 8, w, 16);
  }
  ctx.fillStyle = o.color || '#1f1d1a'; ctx.fillText(txt, X(x), Y(y));
}
function drawWall(w, fill) {
  ctx.fillStyle = fill; poly(wallPoly(w)); ctx.fill();
  REF.openings.filter((o) => o.wall === w.id).forEach((o) => {
    const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const c0 = o.t - o.width / 2, c1 = o.t + o.width / 2;
    const f = { a: { x: w.a.x + ux * c0, y: w.a.y + uy * c0 }, b: { x: w.a.x + ux * c1, y: w.a.y + uy * c1 }, thick: w.thick + 8 };
    ctx.fillStyle = '#f3efe6'; poly(wallPoly(f)); ctx.fill();
    ctx.strokeStyle = '#8c8375'; ctx.lineWidth = 1;
    if (o.type === 'window') { ctx.beginPath(); ctx.moveTo(X(f.a.x), Y(f.a.y)); ctx.lineTo(X(f.b.x), Y(f.b.y)); ctx.stroke(); }
  });
}
function simbolo(d, cor, oco) {

function docDetalhes() {

  figuras().forEach(([t, c, svg]) => (h += `<figure>${svg}<figcaption><b>${esc(t)}</b>${esc(c)}</figcaption></figure>`));

// ---------------------------------------------------------------- navegação
function setTab(id) {
  S.tab = id;
  [...tabsEl.children].forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'));
  const doc = id === 'M' || id === 'D';
  $('main').dataset.doc = doc ? '1' : '0';
  $('viewseg').hidden = doc; $('casa3d').hidden = false;
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
  side();
  if (doc) { (id === 'M' ? docMateriais : docDetalhes)(); return; }
  $('plan-title').textContent = 'Planta — ' + NOME[id];
  S.pv = null; requestAnimationFrame(() => { fitView(); drawPlan(); });
  if (S.view !== '2d') { init3D(); sync3D(); setCam('geral'); }
}
function setView(v) {
  S.view = v; $('stage').dataset.view = v;
  [...$('viewseg').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'));
  if (v !== '2d') init3D();
  requestAnimationFrame(() => { S.pv = null; fitView(); drawPlan(); sync3D(); });
}
$('viewseg').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });

const h0 = (location.hash || '').slice(1);
