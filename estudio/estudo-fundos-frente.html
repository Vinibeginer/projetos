<style>
:root {
  color-scheme: dark;
  --bg: #151412; --panel: #1e1d1a; --panel-2: #26241f; --line: #34312b; --line-soft: #2a2823;
  --text: #ede8df; --muted: #a39a8c; --faint: #7a7266;
  --accent: #e0703f; --accent-soft: rgba(224,112,63,.15); --accent-ink: #1c0f08; --accent-2: #2ba3a3;
  --warn: #e3a53a; --ok: #46a758; --hover: rgba(237,232,223,.06);
  --paper: #f3efe6; --ink: #1f1d1a;
  --font-ui: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #e8e4dc; --panel: #f6f3ee; --panel-2: #eeeae3; --line: #d7d0c4; --line-soft: #e3ddd2;
  --text: #211e1a; --muted: #6b6356; --faint: #8f8679; --accent: #c65a2b; --accent-soft: rgba(198,90,43,.12);
  --accent-ink: #fff8f3; --accent-2: #1b7f7f; --warn: #a8700f; --ok: #2e8540; --hover: rgba(33,30,26,.05);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    color-scheme: light;
    --bg: #e8e4dc; --panel: #f6f3ee; --panel-2: #eeeae3; --line: #d7d0c4; --line-soft: #e3ddd2;
    --text: #211e1a; --muted: #6b6356; --faint: #8f8679; --accent: #c65a2b; --accent-soft: rgba(198,90,43,.12);
    --accent-ink: #fff8f3; --accent-2: #1b7f7f; --warn: #a8700f; --ok: #2e8540; --hover: rgba(33,30,26,.05);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui); }
body { overflow: hidden; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* topo */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; }
.brand small { display: block; font: 500 11px/1.3 var(--font-mono); color: var(--muted); }
.badge { font: 500 10.5px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-soft); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs button { flex: none; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-ui); padding: 8px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.tabs button .k { font: 600 11px/1 var(--font-mono); width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 5px; background: var(--line-soft); color: var(--text); }
.tabs button:hover { background: var(--hover); color: var(--text); }
.tabs button[aria-selected='true'] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.tabs button[aria-selected='true'] .k { background: var(--accent); color: var(--accent-ink); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line-soft); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 12.5px/1 var(--font-ui); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--text); }
.link { color: var(--muted); font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); padding: 7px 10px; border-radius: 8px; white-space: nowrap; }
.link:hover { color: var(--text); background: var(--hover); }

/* área principal */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; min-width: 0; }
.stage[data-view='2d'] { grid-template-columns: minmax(0, 1fr) 0; }
.stage[data-view='3d'] { grid-template-columns: 0 minmax(0, 1fr); }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-title { position: absolute; left: 10px; top: 10px; z-index: 2; font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-radius: 6px; background: rgba(20,19,17,.72); color: #ede8df; pointer-events: none; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--paper); touch-action: none; }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view3d canvas:active { cursor: grabbing; }
.cams { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.cams button { border: 1px solid rgba(255,255,255,.18); background: rgba(20,19,17,.72); color: #ede8df; font: 500 12px/1 var(--font-ui); padding: 7px 10px; border-radius: 7px; cursor: pointer; backdrop-filter: blur(6px); }
.cams button:hover { background: rgba(40,38,34,.85); }
.hint3d { position: absolute; right: 10px; top: 10px; z-index: 2; font: 500 11px/1.4 var(--font-mono); color: #ede8df; background: rgba(20,19,17,.6); padding: 6px 8px; border-radius: 6px; max-width: 60%; text-align: right; pointer-events: none; }

/* painel da opção */
.side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 16px 24px; scrollbar-width: thin; }
.side h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.side .sub { margin: 0 0 14px; color: var(--muted); }
.side h3 { margin: 18px 0 8px; font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { border: 1px solid var(--line-soft); border-radius: 9px; padding: 9px 10px; background: var(--panel-2); }
.kpi b { display: block; font: 600 17px/1.2 var(--font-mono); }
.kpi span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.kpi.warn b { color: var(--warn); }
.kpi.ok b { color: var(--ok); }
ul.list { margin: 0; padding-left: 18px; }
ul.list li { margin: 3px 0; }
.pros li::marker { color: var(--ok); }
.cons li::marker { color: var(--warn); }
.note { margin-top: 14px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--accent-soft); font-size: 12.5px; }
.legend { display: grid; gap: 6px; font-size: 12.5px; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 8px; border: 1px solid rgba(0,0,0,.25); }
.alert { margin: 0 0 12px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--warn); color: var(--text); background: rgba(227,165,58,.12); font-size: 12.5px; }

@media (max-width: 999px) {
  html, body { overflow-x: hidden; }
  body { overflow-y: auto; }
  .topbar { padding: 8px 10px; }
  .badge, .hint3d { display: none; }
  .tabs { order: 5; width: 100%; }
  .seg { order: 6; }
  .topbar > * { min-width: 0; }
  .stage, .main { min-width: 0; width: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .app { height: auto; min-height: 100vh; }
  .stage, .stage[data-view] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .pane { height: 62vh; }
  .stage[data-view='2d'] .pane-3d, .stage[data-view='3d'] .pane-2d { display: none; }
  .stage[data-view='split'] .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .side { border-left: 0; border-top: 1px solid var(--line); }
}
/* ---- específico deste estudo ---- */
.seg.small button { padding: 7px 9px; }
.kpi small { display: block; font: 500 11px/1.3 var(--font-mono); color: var(--muted); margin-top: 3px; }
.dimlist { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.dimlist dt { color: var(--muted); }
.dimlist dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
details.dados { margin-top: 14px; font-size: 12px; }
details.dados summary { cursor: pointer; color: var(--muted); }
details.dados pre { white-space: pre-wrap; word-break: break-all; font: 11px/1.4 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px; max-height: 220px; overflow: auto; }
.casa3d { position: absolute; left: 10px; top: 42px; z-index: 2; display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(20,19,17,.72); backdrop-filter: blur(6px); }
.casa3d button { border: 0; background: transparent; color: #cfc8bb; font: 500 12px/1 var(--font-ui); padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.casa3d button[aria-pressed='true'] { background: #ede8df; color: #1f1d1a; }
.tag { display: inline-block; font: 600 10px/1 var(--font-mono); padding: 3px 6px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); vertical-align: 1px; margin-right: 4px; }
</style>
</head>

    h += `<h3>Cobertura e muros</h3>${li(['Telha termoacústica (ou laje pré-moldada impermeabilizada) caindo para o quintal: 2,70 m no muro e 2,45 m na frente, calha e descida no canto direito.', 'Muro do fundo e trecho do muro esquerdo sobem de 2,00 m até a cobertura (só nessa faixa de 5,25 m). Nada de água caindo para o vizinho.', 'Piso cimentado/cerâmico antiderrapante sob a cobertura, com caimento para o ralo.'])}`;
    h += `<h3>Instalações</h3>${li(['<b>Elétrica:</b> 1 circuito novo para a máquina (tomada 20 A, DR) e 1 para tomadas e luzes da área de serviço e do depósito, saindo das reservas do QDC. A tomada externa T-E1 sai do canto (fica perto do gás) e vem para a bancada.', '<b>Água:</b> ramal com registro a partir da coluna AF-3 (shaft dos fundos, junto da torneira do quintal) até o tanque e a máquina.', '<b>Esgoto:</b> tanque e máquina num ralo/caixa sifonada no piso, ligado à caixa de inspeção CI-1 (≈ 2,5 m).'])}`;
    h += `<div class="note"><b>O projeto hidráulico já prevê uma área de serviço no 2º pavimento</b> (máquina e tanque junto do lavabo do 2º). Esta do quintal pode ser a principal (a do 2º vira só um ponto de reserva) ou uma 2ª, para lavagem pesada: tanque, botas, ferramentas, pets. Me diga qual você prefere.</div>`;
    h += `<h3>Orientação</h3><p style="margin:0">Pela seta de norte da planta, o fundo do lote fica voltado para o norte/nordeste: o muro do fundo faz sombra no quintal no inverno, e a faixa junto da casa é a mais ensolarada. Por isso a área coberta foi para o muro e a faixa ensolarada ficou livre (varal de chão em dia de sol).</p>`;
  } else if (S.tab === 'gas') {
    h += `<h2>Abrigo do botijão</h2><p class="sub">Uma casinha de alvenaria na face de fora da parede lateral da cozinha, entre o pilar do canto e a 1ª janela, com a porta de veneziana virada para o corredor. Do abrigo, um tubo de gás aparente corre pela parede de fora, a 0,40 m do chão, e entra na cozinha atrás do fogão.</p>`;
    h += `<div class="kpis">${kpi(`${fmt(ABRIGO.y1 - ABRIGO.y0)} × ${fmt(ABRIGO.x1 - ABRIGO.x0)} × ${fmt(ABRIGO.z1)}`, 'abrigo por fora (m)')}${kpi(`${fmt(ABRIGO_INT.w)} × ${fmt(ABRIGO_INT.d)} × ${fmt(ABRIGO_INT.h)}`, 'vão interno (2 botijões P13)')}${kpi(fmt(ABRIGO.x0 - 150) + ' m', 'livres no corredor ao lado', 'ok')}${kpi('≈ ' + fmt(GAS_L, 1) + ' m', 'tubo de gás até o fogão')}</div>`;
    h += `<h3>Como é</h3>${li(['Paredes de tijolo (meia vez) e tampa de concreto, sobre base 5 cm acima do piso do corredor: o gás é mais pesado que o ar e não pode ficar em rebaixo.', 'Porta de veneziana metálica (ventilação permanente embaixo e em cima), com cadeado.', 'Cabem 2 botijões P13 (em uso + reserva). Só um? Faça com 0,55 m de largura.', 'Regulador de pressão com manômetro e registro de corte dentro do abrigo; mangueira certificada só no trecho do botijão até o regulador.', 'Tubo de cobre ou multicamada para gás, pintado de amarelo, preso na parede de fora; atravessa a parede com tubo-luva e termina num registro de esfera atrás do fogão (~0,60 m de altura).'])}`;
    h += `<h3>Pontos de atenção (conferir com o gasista)</h3>${li([`A caixa de inspeção <b>CI-1</b> do esgoto fica a ~${fmt(D_CI1, 1)} m do abrigo. A regra usual é ~1,5 m de ralos e caixas de esgoto: use tampa vedada (concreto ou ferro rejuntado, nunca grelha) ou desloque a CI-1, se o esgoto do quintal ainda não foi feito.`, `A <b>caixa de gordura</b> (y 5,80) fica a ~${fmt(D_CGS, 1)} m.`, `A 1ª janela da cozinha fica a ${fmt(CASA.janelasCozinha[0].y0 - ABRIGO.y1)} m, ao lado e 0,10 m acima do topo do abrigo. A veneziana fica na frente (lado do corredor), longe dela; nada de abrigo embaixo de janela.`, `Tomadas e interruptores a ≥ 1,5 m: a tomada externa T-E1 do quintal (hoje a ~${fmt(D_TE1, 1)} m) sai do canto e vai para a área de serviço. A arandela do corredor (y 6,00) fica a ${fmt(6000 - ABRIGO.y1, 1)} m.`, 'O tubo passa embaixo da janela e chega atrás do fogão antes do shaft SH-2 (pilar P6). A tomada baixa T5 do fogão vai para o outro lado do fogão, para não ficar colada no registro de gás.', 'As distâncias e o tipo de tubo seguem a NBR 13523 (central/abrigo de GLP), a NBR 15526 (rede de gás) e a instrução técnica do Corpo de Bombeiros do estado.'], 'cons')}`;
  } else if (S.tab === 'lote') {
    const a = AREAS[S.frente];
    h += `<h2>Lote inteiro</h2><p class="sub">A proposta dos fundos com a opção ${S.frente} da frente. Use as abas A, B e C para trocar a frente.</p>`;
    h += `<div class="kpis">${kpi(pct(a.perm), 'área permeável do lote', a.perm >= hoje.perm * 0.9 ? 'ok' : 'warn', `hoje ${pct(hoje.perm)} (${m2(hoje.perm)} → ${m2(a.perm)} m²)`)}${kpi(pct(a.ocup), 'ocupação (projeção coberta)', '', `hoje ${pct(hoje.ocup)}`)}</div>`;
    h += `<div class="note">Taxa de permeabilidade, taxa de ocupação e o que pode ficar no recuo da frente dependem da lei de uso do solo e do código de obras do município. Confira antes de executar; os números aqui são do desenho (concregrama conta pela metade).</div>`;
  } else {
    const O = OPC[S.tab], a = AREAS[S.tab];
    h += `<h2>Frente ${S.tab} — ${O.nome}</h2><p class="sub">${O.sub}</p>`;
    h += `<div class="kpis">${kpi(O.vagas, 'vagas de carro', '', O.vagasTxt)}${kpi(m2(a.verdeFrente) + ' m²', 'verde no recuo', a.verdeFrente > 15e6 ? 'ok' : 'warn')}${kpi(pct(a.perm), 'permeável no lote (com os fundos)', a.perm >= hoje.perm * 0.9 ? 'ok' : 'warn', `hoje ${pct(hoje.perm)}`)}${kpi(O.custo, 'custo relativo')}</div>`;
    h += `<h3>A favor</h3>${li(O.pros, 'pros')}<h3>Contra</h3>${li(O.cons, 'cons')}`;
    h += `<h3>Vale para as 3 opções</h3>${li(['O recuo tem 4,85 m de fundo (fachada até o muro) por 8,70 m; o primeiro 1,20 m fica sob a varanda do 1º.', 'É a face mais sombreada do lote (a casa fica ao norte dela): use plantas de meia-sombra, como clúsia, moreia, ráfis e lírio-da-paz.', 'Medidor e caixa de telefone/fibra continuam no muro esquerdo; a caixa de inspeção CI-4 do esgoto fica no canteiro da esquerda, com tampa à vista.', 'Iluminação: arandelas da fachada (já previstas) e balizadores no caminho, num circuito com fotocélula.'])}`;
    h += `<div class="note">O que pode ser construído no recuo (pergolado, lixeira, abrigo de medidor, 2º portão, rebaixo de guia) depende da prefeitura. A opção A não tem nada construído; a B tem pergolado sem telhado; a C precisa de autorização para o 2º acesso de veículo.</div>`;
  }
  h += `<details class="dados"><summary>Dados para passar ao projeto (se aprovar)</summary><pre>${esc(JSON.stringify({ paredes: NOVO.walls, aberturas: NOVO.openings, cobertura: ROOF, abrigoGas: ABRIGO, frente: S.frente }, null, 1))}</pre></details>`;
  el.innerHTML = h;
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

// ---------------------------------------------------------------- navegação
function setTab(id) {
  S.tab = id;
  if (OPC[id]) S.frente = id;
  [...tabsEl.children].forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'));
  $('plan-title').textContent = id === 'gas' ? 'Planta — corredor da cozinha' : id === 'fundos' ? 'Planta — quintal dos fundos' : id === 'lote' ? 'Planta — lote inteiro' : 'Planta — recuo da frente';
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
  S.pv = null; requestAnimationFrame(() => { fitView(); drawPlan(); });
  side();
  if (S.view !== '2d') { init3D(); sync3D(); setCam(TABS.find((t) => t.id === id).cam); }
}
function setView(v) {
  S.view = v; $('stage').dataset.view = v;
  [...$('viewseg').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'));
  if (v !== '2d') { init3D(); }
  requestAnimationFrame(() => { S.pv = null; fitView(); drawPlan(); sync3D(); });
}
function setAntes(on) {
  S.antes = on;
  [...$('antes').children].forEach((b) => b.setAttribute('aria-pressed', (b.dataset.antes === '1') === on ? 'true' : 'false'));
  drawPlan(); sync3D();
}
$('viewseg').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
$('antes').addEventListener('click', (e) => { const b = e.target.closest('button[data-antes]'); if (b) setAntes(b.dataset.antes === '1'); });
new ResizeObserver(() => { S.pv = null; fitView(); drawPlan(); sync3D(); }).observe($('stage'));
const h0 = (location.hash || '').slice(1);
setTab(TABS.some((t) => t.id === h0) ? h0 : 'fundos');
window.__estudo = { S, setTab, setView, setAntes, setCam, setCasa, AREAS, NOVO, ABRIGO, OPC };
</script>
