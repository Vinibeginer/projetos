<style>
:root {
  color-scheme: dark;
  --bg: #151412; --panel: #1e1d1a; --panel-2: #26241f; --line: #34312b; --line-soft: #2a2823;
  --text: #ede8df; --muted: #a39a8c; --faint: #7a7266;
  --accent: #e0703f; --accent-soft: rgba(224,112,63,.15); --accent-ink: #1c0f08; --accent-2: #2ba3a3;
  --warn: #e3a53a; --ok: #46a758; --hover: rgba(237,232,223,.06);
  --paper: #f3efe6; --ink: #1f1d1a;
  --font-ui: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #e8e4dc; --panel: #f6f3ee; --panel-2: #eeeae3; --line: #d7d0c4; --line-soft: #e3ddd2;
  --text: #211e1a; --muted: #6b6356; --faint: #8f8679; --accent: #c65a2b; --accent-soft: rgba(198,90,43,.12);
  --accent-ink: #fff8f3; --accent-2: #1b7f7f; --warn: #a8700f; --ok: #2e8540; --hover: rgba(33,30,26,.05);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    color-scheme: light;
    --bg: #e8e4dc; --panel: #f6f3ee; --panel-2: #eeeae3; --line: #d7d0c4; --line-soft: #e3ddd2;
    --text: #211e1a; --muted: #6b6356; --faint: #8f8679; --accent: #c65a2b; --accent-soft: rgba(198,90,43,.12);
    --accent-ink: #fff8f3; --accent-2: #1b7f7f; --warn: #a8700f; --ok: #2e8540; --hover: rgba(33,30,26,.05);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui); }
body { overflow: hidden; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* topo */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 14px; font-weight: 600; }
.brand small { display: block; font: 500 11px/1.3 var(--font-mono); color: var(--muted); }
.badge { font: 500 10.5px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-soft); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs button { flex: none; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-ui); padding: 8px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.tabs button .k { font: 600 11px/1 var(--font-mono); width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 5px; background: var(--line-soft); color: var(--text); }
.tabs button:hover { background: var(--hover); color: var(--text); }
.tabs button[aria-selected='true'] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.tabs button[aria-selected='true'] .k { background: var(--accent); color: var(--accent-ink); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line-soft); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 12.5px/1 var(--font-ui); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--text); }
.link { color: var(--muted); font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); padding: 7px 10px; border-radius: 8px; white-space: nowrap; }
.link:hover { color: var(--text); background: var(--hover); }

/* área principal */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; min-width: 0; }
.stage[data-view='2d'] { grid-template-columns: minmax(0, 1fr) 0; }
.stage[data-view='3d'] { grid-template-columns: 0 minmax(0, 1fr); }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-title { position: absolute; left: 10px; top: 10px; z-index: 2; font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-radius: 6px; background: rgba(20,19,17,.72); color: #ede8df; pointer-events: none; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--paper); touch-action: none; }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view3d canvas:active { cursor: grabbing; }
.cams { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.cams button { border: 1px solid rgba(255,255,255,.18); background: rgba(20,19,17,.72); color: #ede8df; font: 500 12px/1 var(--font-ui); padding: 7px 10px; border-radius: 7px; cursor: pointer; backdrop-filter: blur(6px); }
.cams button:hover { background: rgba(40,38,34,.85); }
.hint3d { position: absolute; right: 10px; top: 10px; z-index: 2; font: 500 11px/1.4 var(--font-mono); color: #ede8df; background: rgba(20,19,17,.6); padding: 6px 8px; border-radius: 6px; max-width: 60%; text-align: right; pointer-events: none; }

/* painel da opção */
.side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 16px 24px; scrollbar-width: thin; }
.side h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.side .sub { margin: 0 0 14px; color: var(--muted); }
.side h3 { margin: 18px 0 8px; font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { border: 1px solid var(--line-soft); border-radius: 9px; padding: 9px 10px; background: var(--panel-2); }
.kpi b { display: block; font: 600 17px/1.2 var(--font-mono); }
.kpi span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.kpi.warn b { color: var(--warn); }
.kpi.ok b { color: var(--ok); }
ul.list { margin: 0; padding-left: 18px; }
ul.list li { margin: 3px 0; }
.pros li::marker { color: var(--ok); }
.cons li::marker { color: var(--warn); }
.note { margin-top: 14px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--accent-soft); font-size: 12.5px; }
.legend { display: grid; gap: 6px; font-size: 12.5px; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 8px; border: 1px solid rgba(0,0,0,.25); }
.alert { margin: 0 0 12px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--warn); color: var(--text); background: rgba(227,165,58,.12); font-size: 12.5px; }

@media (max-width: 999px) {
  html, body { overflow-x: hidden; }
  body { overflow-y: auto; }
  .topbar { padding: 8px 10px; }
  .badge, .hint3d { display: none; }
  .tabs { order: 5; width: 100%; }
  .seg { order: 6; }
  .topbar > * { min-width: 0; }
  .stage, .main { min-width: 0; width: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .app { height: auto; min-height: 100vh; }
  .stage, .stage[data-view] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .pane { height: 62vh; }
  .stage[data-view='2d'] .pane-3d, .stage[data-view='3d'] .pane-2d { display: none; }
  .stage[data-view='split'] .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .side { border-left: 0; border-top: 1px solid var(--line); }
}
/* ---- específico deste estudo ---- */
.seg.small button { padding: 7px 9px; }
.kpi small { display: block; font: 500 11px/1.3 var(--font-mono); color: var(--muted); margin-top: 3px; }
.dimlist { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.dimlist dt { color: var(--muted); }
.dimlist dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
details.dados { margin-top: 14px; font-size: 12px; }
details.dados summary { cursor: pointer; color: var(--muted); }
details.dados pre { white-space: pre-wrap; word-break: break-all; font: 11px/1.4 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px; max-height: 220px; overflow: auto; }
.casa3d { position: absolute; left: 10px; top: 42px; z-index: 2; display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(20,19,17,.72); backdrop-filter: blur(6px); }
.casa3d button { border: 0; background: transparent; color: #cfc8bb; font: 500 12px/1 var(--font-ui); padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.casa3d button[aria-pressed='true'] { background: #ede8df; color: #1f1d1a; }
.tag { display: inline-block; font: 600 10px/1 var(--font-mono); padding: 3px 6px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); vertical-align: 1px; margin-right: 4px; }
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================================================
//  ESTUDO — fundos (depósito de ferramentas + área de serviço), abrigo do botijão e recuo da frente.
//  Só um estudo: lê a planta de referência (as built) de src/00-data.js e desenha a proposta por cima.
//  Mesmo sistema do estúdio: mm, origem no canto fundo-esquerdo do lote, x → direita, y → rua, z = altura.
//  As paredes novas usam o mesmo formato de 00-data.js (FUNDOS[n].walls / FUNDOS[n].openings), para entrarem no projeto
//  sem retrabalho se forem aprovadas.
// =====================================================================================================
const REF = DD.data.initialState();
const fmt = (mm, d = 2) => (mm / 1000).toFixed(d).replace('.', ',');
const m2 = (a) => (a / 1e6).toFixed(1).replace('.', ',');

// ---------------------------------------------------------------- dados da casa usados aqui (as built)
const CASA = {
  muroH: 2000,
  // corredor esquerdo (entre a parede da cozinha e o muro) e quintal dos fundos — faces internas

  pilarP6: { y0: 6560, y1: 7160 },

// ---------------------------------------------------------------- PROPOSTA DOS FUNDOS — duas formas, as duas no muro da direita
// (o lado oposto ao corredor da cozinha, que fica livre). Cobertura: plano inclinado de z0 (em y0) a z1 (em y1).
const zRoof = (r, y) => r.z0 + ((r.z1 - r.z0) * (Math.min(Math.max(y, r.y0), r.y1) - r.y0)) / (r.y1 - r.y0);
const EQ = {
  tanque: { n: 'Tanque', z1: 900, c: 0xf2f2f0, plan: '#fbfbf9' },
  maquina: { n: 'Máquina de lavar', z1: 1000, c: 0xf6f6f6, plan: '#ffffff', porta: true },
  armario: { n: 'Armário + bancada', z1: 900, c: 0xb58a62, plan: '#d8bfa4' },
  aereo: { n: 'Aéreo', z0: 1500, z1: 2150, c: 0xc79e76, planSkip: true },
  cesto: { n: 'Cesto / rodo', z1: 1100, c: 0x8aa0b4, plan: '#c9d5df' },
  estante: { n: 'Prateleiras', z1: 2000, c: 0x7d8288, plan: '#c4c7cb', estante: true },
  painel: { n: 'Painel de ferramentas', z0: 900, z1: 1800, c: 0xd9c9a8, plan: '#d9c9a8' },
  cortador: { n: 'Cortador / carrinho', z1: 650, c: 0x5c7a4a, plan: '#a9bf9a' },
};
const eq = (k, x0, x1, y0, y1, o) => Object.assign({ k, x0, x1, y0, y1, z0: 0 }, EQ[k], o || {});
const PAREDE = (id, ax, ay, bx, by, o) => Object.assign({ id, floor: 'f0', a: { x: ax, y: ay }, b: { x: bx, y: by }, thick: 150, height: 2470, kind: 'partition' }, o || {});
const PORTA_DEP = (wall, t) => ({ id: 'n0_p_dep', wall, code: 'P1', type: 'door', t, width: 800, height: 2100, sill: 0, style: 'swing', hinge: 'start', side: 1, desc: 'Porta do depósito 0,80 × 2,10 (veneziana de alumínio = ventilação permanente)' });

const FUNDOS = {
  1: {
    nome: 'Canto direito do fundo',

    serv: { x0: 3900, x1: 6750, y0: 150, y1: 1650 },

      PAREDE('n0_depFrente', 6750, 1575, 8850, 1575),
    ],
    openings: [PORTA_DEP('n0_depFrente', 650), JANELA_DEP('n0_depFrente', 1600)],
    muroAlto: [{ x0: 3750, x1: 9000, y0: 0, y1: 150, roof: 0 }, { x0: 8850, x1: 9000, y0: 150, y1: 1950, roof: 0 }],
    equip: [
      eq('cesto', 3950, 4320, 160, 560),
      eq('armario', 4380, 5380, 160, 700), eq('aereo', 4380, 5380, 160, 500),
      eq('maquina', 5440, 6040, 160, 820),
      eq('tanque', 6100, 6700, 160, 710),
      eq('estante', 6950, 8800, 160, 560),
      eq('painel', 6900, 6940, 650, 1400),
      eq('cortador', 8200, 8800, 850, 1450),
    ],
    varal: { x0: 4000, x1: 5350, y0: 950, y1: 1450, z: 2250, fios: 5, ao: 'x' },
    pontos: [
      { k: 'tue', x: 5740, y: 150, n: 'Tomada da máquina 2P+T 20 A (circuito próprio, DR 30 mA)' },
      { k: 'tug', x: 4880, y: 150, n: 'Tomada da bancada 2P+T 10 A' },
      { k: 'il', x: 5300, y: 900, n: 'Luminária da área de serviço' },
      { k: 'int', x: 3900, y: 1450, n: 'Interruptor da área de serviço' },
      { k: 'il', x: 7850, y: 825, n: 'Luminária do depósito' },
      { k: 'int', x: 6950, y: 1450, n: 'Interruptor do depósito (por dentro, ao lado da porta)' },
      { k: 'tug', x: 6900, y: 1250, n: 'Tomada do depósito' },
      { k: 'af', x: 6400, y: 150, n: 'Torneira do tanque' },
      { k: 'af', x: 5740, y: 250, n: 'Torneira da máquina (com registro)' },

$('casa3d').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-casa]'); if (!b) return;
  const antes = S.casa; setCasa(b.dataset.casa);
  // sem a casa, a melhor vista dos fundos é de onde a casa estava
  if (antes === 'inteira' && b.dataset.casa !== 'inteira' && S.tab !== 'lote') setCam('anexos');
});
$('cams').addEventListener('click', (e) => { const b = e.target.closest('button[data-cam]'); if (b) setCam(b.dataset.cam); });

// ---------------------------------------------------------------- painel lateral
function kpi(v, t, cls, small) { return `<div class="kpi ${cls || ''}"><b>${v}</b><span>${t}</span>${small ? `<small>${small}</small>` : ''}</div>`; }
const li = (a, cls) => `<ul class="list ${cls || ''}">${a.map((x) => `<li>${x}</li>`).join('')}</ul>`;
const hoje = AREAS.hoje;
function side() {
  const el = $('side'); let h = '';
  if (S.tab === 'f1' || S.tab === 'f2') {
    const v = S.fundos, F = FUNDOS[v], D = F.dep, Sv = F.serv, a = AREAS[v];
    const area = (r) => m2((r.x1 - r.x0) * (r.y1 - r.y0)) + ' m²';
    const cob = F.roofs.reduce((s, r) => s + (r.x1 - r.x0) * (r.y1 - r.y0), 0);
    h += `<h2>Fundos ${v} — ${F.nome}</h2><p class="sub">${F.sub}</p>`;
    h += `<div class="kpis">${kpi(area(D), 'depósito de ferramentas (fechado)', 'ok')}${kpi(area(Sv), 'área de serviço (coberta)', 'ok')}${kpi(m2(cob) + ' m²', 'cobertura nova (projeção)')}${kpi(pct(a.perm), 'permeável no lote', a.perm >= hoje.perm * 0.9 ? 'ok' : 'warn', `hoje ${pct(hoje.perm)}`)}</div>`;
    h += `<h3>Medidas</h3><dl class="dimlist">${F.medidas.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>`;
    h += `<h3>A favor</h3>${li(F.pros, 'pros')}<h3>Contra</h3>${li(F.cons, 'cons')}`;
    h += `<h3>Depósito</h3>${li(['Porta 0,80 × 2,10 de veneziana de alumínio (ventila sempre) e basculante 0,60 × 0,60.', 'Estante de aço no muro do fundo, painel de ferramentas na parede lateral e lugar para cortador de grama e carrinho.'])}`;
    h += `<h3>Cobertura e muros</h3>${li(['Telha termoacústica (ou laje pré-moldada impermeabilizada) de 2,70 m a 2,45 m, sempre caindo para dentro do lote, com calha e descida.', 'Os muros de divisa sobem de 2,00 m até a cobertura só nos trechos cobertos. Nada de água caindo para o vizinho.', 'Piso cimentado/cerâmico antiderrapante sob a cobertura, com caimento para o ralo.'])}`;
    h += `<h3>Instalações</h3>${li([`<b>Elétrica:</b> 1 circuito novo para a máquina (tomada 20 A, DR) e 1 para tomadas e luzes da área de serviço e do depósito, saindo das reservas do QDC.`, `<b>Água:</b> ${F.agua}`, `<b>Esgoto:</b> ${F.esgoto}`])}`;
    h += `<div class="note"><b>O projeto hidráulico já prevê uma área de serviço no 2º pavimento</b> (máquina e tanque junto do lavabo do 2º). Esta dos fundos pode ser a principal ou uma 2ª, para lavagem pesada. Me diga qual você prefere.</div>`;
  } else if (S.tab === 'gas') {
    h += `<h2>Abrigo do botijão</h2><p class="sub">Uma casinha de alvenaria na face de fora da parede lateral da cozinha, entre o pilar do canto e a 1ª janela, com a porta de veneziana virada para o corredor. Do abrigo, um tubo de gás aparente corre pela parede de fora, a 0,40 m do chão, e entra na cozinha atrás do fogão. Vale para as duas formas dos fundos.</p>`;
    h += `<div class="kpis">${kpi(`${fmt(ABRIGO.y1 - ABRIGO.y0)} × ${fmt(ABRIGO.x1 - ABRIGO.x0)} × ${fmt(ABRIGO.z1)}`, 'abrigo por fora (m)')}${kpi(`${fmt(ABRIGO_INT.w)} × ${fmt(ABRIGO_INT.d)} × ${fmt(ABRIGO_INT.h)}`, 'vão interno (2 botijões P13)')}${kpi(fmt(ABRIGO.x0 - 150) + ' m', 'livres no corredor ao lado', 'ok')}${kpi('≈ ' + fmt(GAS_L, 1) + ' m', 'tubo de gás até o fogão')}</div>`;
    h += `<h3>Como é</h3>${li(['Paredes de tijolo (meia vez) e tampa de concreto, sobre base 5 cm acima do piso do corredor: o gás é mais pesado que o ar e não pode ficar em rebaixo.', 'Porta de veneziana metálica (ventilação permanente embaixo e em cima), com cadeado.', 'Cabem 2 botijões P13 (em uso + reserva). Só um? Faça com 0,55 m de largura.', 'Regulador de pressão com manômetro e registro de corte dentro do abrigo; mangueira certificada só no trecho do botijão até o regulador.', 'Tubo de cobre ou multicamada para gás, pintado de amarelo, preso na parede de fora; atravessa a parede com tubo-luva e termina num registro de esfera atrás do fogão (~0,60 m de altura).'])}`;
    h += `<h3>Pontos de atenção (conferir com o gasista)</h3>${li([`A caixa de inspeção <b>CI-1</b> do esgoto fica a ~${fmt(D_CI1, 1)} m do abrigo. A regra usual é ~1,5 m de ralos e caixas de esgoto: use tampa vedada (concreto ou ferro rejuntado, nunca grelha) ou desloque a CI-1, se o esgoto do quintal ainda não foi feito.`, `A <b>caixa de gordura</b> (y 5,80) fica a ~${fmt(D_CGS, 1)} m.`, `A 1ª janela da cozinha fica a ${fmt(CASA.janelasCozinha[0].y0 - ABRIGO.y1)} m, ao lado e 0,10 m acima do topo do abrigo. A veneziana fica na frente (lado do corredor), longe dela; nada de abrigo embaixo de janela.`, `Tomadas e interruptores a ≥ 1,5 m: a tomada externa T-E1 do quintal (hoje a ~${fmt(D_TE1, 1)} m) sai do canto. A arandela do corredor (y 6,00) fica a ${fmt(6000 - ABRIGO.y1, 1)} m.`, 'O tubo passa embaixo da janela e chega atrás do fogão antes do shaft SH-2 (pilar P6). A tomada baixa T5 do fogão vai para o outro lado do fogão, para não ficar colada no registro de gás.', 'As distâncias e o tipo de tubo seguem a NBR 13523 (central/abrigo de GLP), a NBR 15526 (rede de gás) e a instrução técnica do Corpo de Bombeiros do estado.'], 'cons')}`;
  } else if (S.tab === 'lote') {
    const a = AREAS[S.fundos];
    h += `<h2>Lote inteiro</h2><p class="sub">Fundos ${S.fundos} (${FUNDOS[S.fundos].nome.toLowerCase()}), abrigo do gás e a varanda de entrada com deck. Troque a forma dos fundos nas abas 1 e 2.</p>`;
    h += `<div class="kpis">${kpi(pct(a.perm), 'área permeável do lote', a.perm >= hoje.perm * 0.9 ? 'ok' : 'warn', `hoje ${pct(hoje.perm)} (${m2(hoje.perm)} → ${m2(a.perm)} m²)`)}${kpi(pct(a.ocup), 'ocupação (projeção coberta)', '', `hoje ${pct(hoje.ocup)}`)}</div>`;
    h += `<div class="note">Taxa de permeabilidade, taxa de ocupação e o que pode ficar no recuo da frente dependem da lei de uso do solo e do código de obras do município. Confira antes de executar; os números aqui são do desenho.</div>`;
  } else {
    const a = AREAS[S.fundos];
    h += `<h2>Frente — ${FRENTE.nome}</h2><p class="sub">${FRENTE.sub}</p>`;
    h += `<div class="kpis">${kpi(`${fmt(DECK.x1 - DECK.x0)} × ${fmt(DECK.y1 - DECK.y0)}`, `deck (${m2((DECK.x1 - DECK.x0) * (DECK.y1 - DECK.y0))} m²), 1,20 m sob a varanda`)}${kpi('2', 'vagas de carro', '', '1 na garagem + 1 na rampa, em linha')}${kpi(m2(a.verdeFrente) + ' m²', 'jardim no recuo')}${kpi(pct(a.perm), 'permeável no lote', a.perm >= hoje.perm * 0.9 ? 'ok' : 'warn', `hoje ${pct(hoje.perm)}`)}</div>`;
    h += `<h3>O que mudou nesta versão</h3>${li(['O ripado no muro fica só fora dos portões: entre o portão do carro e o social, e depois da lixeira. Nada passa por cima do portão social.', 'A porta da sala fica com a passagem livre; o estar foi para a direita, diante da janela, com pufes baixos (abaixo do peitoril de 0,60 m).', 'O 2º carro fica na rampa alinhado com o carro da garagem, e a rampa continua como no projeto.', 'O padrão de entrada (medidor) no canto esquerdo fica com piso livre na frente, para a leitura.'])}`;
    h += `<h3>Como é</h3>${li(['Deck de madeira (cumaru ou ipê) ou de WPC sobre base drenante, no nível da soleira da porta da sala (sem degrau).', `Pergolado de madeira tratada (ou metalon) com ripas a cada 30 cm, preso numa viga junto da laje da varanda do 1º e apoiado em 3 pilares na frente, sem telhado. Fita de LED na viga da frente.`, 'Estar: sofá externo com encosto para a rua, mesa de centro e 2 pufes; vasos dos dois lados da entrada e jardineira na borda esquerda do deck.', 'Caminho de pedra do portão social até o deck, com balizadores.', 'Jardim de sombra nas sobras (a frente é a face mais sombreada do lote): clúsia, moreia, ráfis, lírio-da-paz, e uma árvore pequena no canto direito.', 'Lixeira embutida no muro ao lado do portão social, com abertura para a calçada.'])}`;
    const rampa = (4150 - 650) * (19850 - 16200), ganho = rampa * 0.5;
    h += `<div class="note"><b>Área permeável:</b> com os fundos ${S.fundos} e o deck, o lote fica com ${pct(a.perm)} de área permeável (hoje ${pct(hoje.perm)}). Se a prefeitura exigir mais, a rampa do carro em concregrama (piso drenante) devolve ~${m2(ganho)} m² (+${Math.round((100 * ganho) / 18e7)}%), e o deck pode ficar sobre brita em vez de contrapiso.</div>`;
    h += `<div class="note">Pergolado sem telhado normalmente não conta como área construída, mas o que pode ficar no recuo depende da prefeitura. Confirme antes de executar.</div>`;
  }
  const F = FUNDOS[S.fundos];
  h += `<details class="dados"><summary>Dados para passar ao projeto (se aprovar)</summary><pre>${esc(JSON.stringify({ fundos: S.fundos, paredes: F.walls, aberturas: F.openings, coberturas: F.roofs, abrigoGas: ABRIGO, deck: DECK }, null, 1))}</pre></details>`;
  el.innerHTML = h;
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

// ---------------------------------------------------------------- navegação
function setTab(id) {
  S.tab = id;
  if (id === 'f1' || id === 'f2') S.fundos = id.slice(1);
  [...tabsEl.children].forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'));
  $('plan-title').textContent = id === 'gas' ? 'Planta — corredor da cozinha' : id === 'f1' || id === 'f2' ? `Planta — fundos ${S.fundos}` : id === 'lote' ? 'Planta — lote inteiro' : 'Planta — recuo da frente';
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
  S.pv = null; requestAnimationFrame(() => { fitView(); drawPlan(); });
  side();
  if (S.view !== '2d') { init3D(); sync3D(); setCam(S.casa !== 'inteira' && id !== 'lote' ? 'anexos' : TABS.find((t) => t.id === id).cam); }
}
function setView(v) {
  S.view = v; $('stage').dataset.view = v;
  [...$('viewseg').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'));
  if (v !== '2d') { init3D(); }
  requestAnimationFrame(() => { S.pv = null; fitView(); drawPlan(); sync3D(); });
}
function setAntes(on) {
  S.antes = on;
  [...$('antes').children].forEach((b) => b.setAttribute('aria-pressed', (b.dataset.antes === '1') === on ? 'true' : 'false'));
  drawPlan(); sync3D();
}
$('viewseg').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
$('antes').addEventListener('click', (e) => { const b = e.target.closest('button[data-antes]'); if (b) setAntes(b.dataset.antes === '1'); });
new ResizeObserver(() => { S.pv = null; fitView(); drawPlan(); sync3D(); }).observe($('stage'));
const h0 = (location.hash || '').slice(1);
setTab(TABS.some((t) => t.id === h0) ? h0 : h0 === 'fundos' ? 'f1' : /^[ABC]$/.test(h0) ? 'frente' : 'f1');
window.__estudo = { S, setTab, setView, setAntes, setCam, setCasa, AREAS, FUNDOS, ABRIGO, FRENTE, zonas, r3: () => R3 };
</script>
