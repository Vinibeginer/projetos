<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Dados e cálculo do projeto: src/17-hidro.js (o mesmo módulo desenha a camada "Hidráulica" no estúdio).
const {
  L1, L2, LR, ZG, VT, PLATAFORMA, CX_BASE, NA_MIN, PESSOAS, PER_CAPITA, TIPOS, FX, FXBY, AFN, AFE, ALN, ALE, pb, ES, ESBY, BOX, BOXBY, SHAFTS, DI, vmax, jFWH, dist3, polyLen, fmtm, fmtn, afPts, solveAF, solveES, LIM_VENT, projOn, lenFrom, lenUpTo, ventDistances, angleAt, quantities, passagens, AF, VENT, QT, PASS, floorOf, pipeList, PIPES,
} = DD.hidro;

// =====================================================================================================
//  INTERFACE
// =====================================================================================================
// Paredes, portas e janelas: a planta as built de referência (src/00-data.js) até chegar a planta salva na nuvem da
// obra — a mesma que o estúdio edita (tabela projeto_planta). As cotas das pranchas são medidas nas paredes em uso.
const REF_DOC = window.DD && DD.data ? DD.data.initialState() : null;
let doc = REF_DOC;
const DOC_SRC = { kind: 'ref', at: null };
const PRANCHAS = [
  { id: 'T', label: 'Térreo', fid: 'f0' },
  { id: '1', label: '1º Pav.', fid: 'f1' },
  { id: '2', label: '2º Pav.', fid: 'f2' },
  { id: 'C', label: 'Cobertura', fid: 'f2' },
  { id: '3d', label: '3D' },
  { id: 'calc', label: 'Memorial e cálculo' },
  { id: 'mat', label: 'Materiais' },
  { id: 'pdf', label: 'Pranchas (PDF)' },
];
const FL_RANGE = { T: [-2000, L1], 1: [L1, L2], 2: [L2, LR], C: [LR, 20000] };
const COLORS = { AF: '#2f80d8', ES: '#9a5b2c', VE: '#2f9e5f', AL: '#7a4fc2' };
const S = { tab: 'T', layers: { AF: true, ES: true, VE: true, AL: true, TXT: true, WALLS: true }, view: null, hover: null };

const $ = (id) => document.getElementById(id);
const tabs = $('tabs');
PRANCHAS.forEach((p) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = p.id; b.textContent = p.label;
  b.addEventListener('click', () => setTab(p.id));
  tabs.appendChild(b);
});
$('layers').addEventListener('change', (e) => {
  const k = e.target.dataset.layer;
  if (!k) return;
  S.layers[k] = e.target.checked;
  drawPlan(); if (S.tab === '3d') sync3D();
});

// ---------------------------------------------------------------------------------------------- planta
const plan = $('plan');
let ctx = plan.getContext('2d');
const BOUNDS = { T: [-2900, 1700, 9300, 20400], 1: [-2900, 2300, 7900, 11000], 2: [-2900, 2300, 7900, 11000], C: [-2900, 2300, 7900, 11000] };
function fitView() {
  const [x0, y0, x1, y1] = BOUNDS[S.tab] || BOUNDS.T;
  const w = plan.clientWidth, h = plan.clientHeight;
  const s = Math.min((w - 30) / (x1 - x0), (h - 30) / (y1 - y0));
  S.view = { s, ox: (w - (x1 - x0) * s) / 2 - x0 * s, oy: (h - (y1 - y0) * s) / 2 - y0 * s };
}
const X = (x) => S.view.ox + x * S.view.s;
const Y = (y) => S.view.oy + y * S.view.s;

function wallRect(w) {
  const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L * w.thick / 2, ny = dx / L * w.thick / 2;
  return [[w.a.x + nx, w.a.y + ny], [w.b.x + nx, w.b.y + ny], [w.b.x - nx, w.b.y - ny], [w.a.x - nx, w.a.y - ny]];
}
function drawWalls(fid, faint) {
  if (!doc) return;
  const walls = doc.walls.filter((w) => w.floor === fid);
  walls.forEach((w) => {
    const r = wallRect(w);
    ctx.beginPath(); r.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.closePath();
    ctx.fillStyle = faint ? 'rgba(46,42,38,.18)' : w.kind === 'structural' ? '#3a3631' : w.kind === 'partition' ? '#8c8375' : w.kind === 'railing' ? 'rgba(46,42,38,.35)' : '#b3aa9b';
    ctx.fill();
  });
  if (faint) return;
  doc.openings.forEach((o) => {
    const w = walls.find((x) => x.id === o.wall);
    if (!w) return;
    const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const c0 = o.t - o.width / 2, c1 = o.t + o.width / 2;
    const fake = { a: { x: w.a.x + ux * c0, y: w.a.y + uy * c0 }, b: { x: w.a.x + ux * c1, y: w.a.y + uy * c1 }, thick: w.thick + 6 };
    const r = wallRect(fake);
    ctx.beginPath(); r.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.closePath();
    ctx.fillStyle = '#f3efe6'; ctx.fill();
    if (o.type === 'window') {
      ctx.strokeStyle = '#3a3631'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(fake.a.x), Y(fake.a.y)); ctx.lineTo(X(fake.b.x), Y(fake.b.y)); ctx.stroke();
      ctx.stroke(new Path2D(r.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1])).join(' ') + 'Z'));
    }
  });
}
function drawFixture(f) {
  const s = S.view.s;
  ctx.save();
  ctx.translate(X(f.x), Y(f.y));
  ctx.rotate(((f.rot || 0) * Math.PI) / 180);
  ctx.strokeStyle = '#4d4740'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 1.2;
  const R = (w, d) => { ctx.beginPath(); ctx.rect(-w / 2 * s, -d / 2 * s, w * s, d * s); ctx.fill(); ctx.stroke(); };
  if (f.t === 'vaso') { R(380, 200); ctx.translate(0, 0); ctx.beginPath(); ctx.ellipse(0, 260 * s, 170 * s, 230 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  else if (f.t === 'lav') { ctx.beginPath(); ctx.ellipse(0, 0, 260 * s, 190 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  else if (f.t === 'ch') { R(760, 760); ctx.beginPath(); ctx.moveTo(-380 * s, -380 * s); ctx.lineTo(380 * s, 380 * s); ctx.moveTo(380 * s, -380 * s); ctx.lineTo(-380 * s, 380 * s); ctx.stroke(); }
  else if (f.t === 'pia') { R(500, 420); ctx.beginPath(); ctx.arc(0, 0, 90 * s, 0, Math.PI * 2); ctx.stroke(); }
  else if (f.t === 'tanque') { R(560, 500); ctx.beginPath(); ctx.rect(-200 * s, -150 * s, 400 * s, 300 * s); ctx.stroke(); }
  else if (f.t === 'mlr') { R(600, 600); ctx.beginPath(); ctx.arc(0, 0, 200 * s, 0, Math.PI * 2); ctx.stroke(); }
  else if (f.t === 'tj') { ctx.fillStyle = '#2f80d8'; ctx.beginPath(); ctx.arc(0, 0, Math.max(3, 80 * s), 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  if (S.layers.TXT) label(f.id, f.x, f.y - 380, '#4d4740', true);
}
function label(txt, x, y, color, small, bg) {
  ctx.font = (small ? '500 10px' : '600 11px') + ' "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 6;
  ctx.fillStyle = bg || 'rgba(243,239,230,.88)'; ctx.fillRect(X(x) - w / 2, Y(y) - 7, w, 14);

function wallRects(fid, d = doc) {
  if (!d) return [];
  return d.walls.filter((w) => w.floor === fid && w.kind !== 'railing').map((w) => {
    const r = wallRect(w), xs = r.map((p) => p[0]), ys = r.map((p) => p[1]);
    return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), muro: w.kind === 'muro' };
  });
}
/** Medidas de um ponto até as faces das paredes mais próximas (uma na horizontal, uma na vertical da planta). */
function refsOf(fid, x, y, dc = doc) {
  const R = wallRects(fid, dc), o = {};
  const own = R.find((r) => x >= r.x0 - 1 && x <= r.x1 + 1 && y >= r.y0 - 1 && y <= r.y1 + 1);
  const put = (k, d, face, r) => { if (!o[k] || d < o[k].d) o[k] = { d, face, muro: r.muro }; };
  R.forEach((r) => {
    if (r === own) return;
    if (y >= r.y0 - 1 && y <= r.y1 + 1) { if (r.x1 <= x + 1) put('esq', x - r.x1, r.x1, r); if (r.x0 >= x - 1) put('dir', r.x0 - x, r.x0, r); }
    if (x >= r.x0 - 1 && x <= r.x1 + 1) { if (r.y1 <= y + 1) put('fundo', y - r.y1, r.y1, r); if (r.y0 >= y - 1) put('frente', r.y0 - y, r.y0, r); }
  });
