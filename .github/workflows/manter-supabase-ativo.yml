# Mantém o projeto Supabase ativo.
# O plano gratuito pausa o banco após 7 dias sem nenhuma consulta.
# Este agendamento faz uma chamada inofensiva todos os dias.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 12 * * *'   # todo dia, 12:17 UTC (09:17 em Brasília)
  workflow_dispatch:         # permite rodar na mão pelo site do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o banco
        env:
          SB_URL: https://qazbyotibhqrwbuvmdza.supabase.co
          # chave anon (pública, a mesma que já fica no HTML do tracker)
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhemJ5b3RpYmhxcndidXZtZHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjEzNjcsImV4cCI6MjEwMDM5NzM2N30.YzlSaoUz1G2Or0hIn_yYOghbqRGSj7t1oUcIWohBnps
        run: |
          echo "Chamando $SB_URL/rest/v1/rpc/ping"
          curl -sS -X POST "$SB_URL/rest/v1/rpc/ping" \
            -H "apikey: $SB_ANON" \
            -H "Authorization: Bearer $SB_ANON" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body \
            --retry 3 --retry-delay 20 --max-time 60
          echo ""
          echo "Sinal de vida enviado com sucesso."

